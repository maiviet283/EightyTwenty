  /api/v1/app/auth/sign-out:
    post:
      operationId: v1_app_auth_sign_out_create
      description: |-
        Revokes the refresh token. Always `204`, even when the token is unknown, expired or already
        revoked, and even without a valid access token. The app clears its local session anyway.
      summary: Sign out (revoke the refresh token)
      tags:
      - App · Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutInRequest'
      security:
      - {}
      responses:
