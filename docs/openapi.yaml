    post:
      operationId: v1_pos_orders_create
      description: |-
        `OrdersService.create` — the till's `Order` as it is (status `new`, usually unpaid; a gift
        card applied in the cart arrives as the first entry of `payments`).

        **Checks** (first failure returned): café on this account (`404`) · `channel` is `pos`
        (`422`) · `id` not used before (`409 CONFLICT` — every till must number its orders
        uniquely, e.g. `<VITE_TERMINAL_ID>-<n>`; a retry with the same Idempotency-Key replays
        instead) · `total` = Σ(price × qty) − discounts + delivery (10 %) to the cent (`422`).

        **Prices are not rejected**: the sale already happened at the counter. Lines whose price
        differs from the café's current menu (or items/options not on it, or sold-out items) are
        recorded and listed on the order for a manager in BOS (Orders → "Check prices").
      summary: Record an order rung up at the till
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: One per command, reused on every retry (the till's outbox entry
          id).
      - in: header
        name: X-Terminal-Id
        schema:
          type: string
        description: This till, e.g. PHILLIP-TILL-1.
      tags:
      - POS · Orders & kitchen
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosOrderInRequest'
            examples:
              Dine-inOrder:
                value:
                  id: BRADDON-TILL-1-0042
                  channel: pos
                  type: dinein
                  status: new
                  accepted: true
                  cafe: braddon
                  time: 09:41
                  placedAt: '2026-10-16T09:41:12+11:00'
                  table: T4
                  tables:
                  - T4
                  lines:
                  - key: L7K2Q9XMA
                    itemId: hotcoffee
                    name: Milk Based Coffee
                    price: 6.3
                    qty: 2
                    sel:
                      drink:
                      - Flat White
                      var:
                      - OAT ADC
                    adjust:
                    - Extra hot
                    note: ''
                  - key: LQ2M7ZP0C
                    itemId: mighty
                    name: Mighty Breakfast
                    price: 35
                    qty: 1
                    sel: {}
                    adjust: []
                    note: Eggs poached
                  total: 47.6
                  paid: false
                  methods: []
                  payments: []
                  note: ''
                  discounts: []
                  rewardUsed: false
                  staff: Mia Tran
                  history:
                  - at: 16 Oct, 9:41 am
                    what: Created on till by Mia Tran
                summary: Dine-in order
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosOrderOut'
              examples:
                Recorded:
                  value:
                    id: BRADDON-TILL-1-0042
                    channel: pos
                    type: dinein
                    status: new
                    accepted: true
                    cafe: braddon
                    time: 09:41
                    placedAt: '2026-10-16T09:41:12+11:00'
                    table: T4
                    tables:
                    - T4
                    lines:
                    - key: L7K2Q9XMA
                      itemId: hotcoffee
                      name: Milk Based Coffee
                      price: 6.3
                      qty: 2
                      sel:
                        drink:
                        - Flat White
                        var:
                        - OAT ADC
                      adjust:
                      - Extra hot
                      note: ''
                    - key: LQ2M7ZP0C
                      itemId: mighty
                      name: Mighty Breakfast
                      price: 35
                      qty: 1
                      sel: {}
                      adjust: []
                      note: Eggs poached
                    total: 47.6
                    paid: false
                    methods: []
                    payments: []
                    note: ''
                    discounts: []
                    rewardUsed: false
                    staff: Mia Tran
                    history:
                    - at: 16 Oct, 9:41 am
                      what: Created on till by Mia Tran
                    refunds: []
                    stamped: false
                    cleared: false
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                NumberAlreadyUsed:
                  value:
                    error:
                      code: CONFLICT
                      message: Order BRADDON-TILL-1-0042 already exists. Each till
                        must number its orders uniquely.
                      fields: {}
                  summary: Number already used
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                TotalDoesNotAddUp:
                  value:
                    error:
                      code: VALIDATION
                      message: 'The order total $40.00 does not add up: lines $47.60
                        − discounts $0.00 + delivery $0.00 = $47.60.'
