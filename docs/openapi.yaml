      operationId: v1_pos_staff_verify_pin_create
      description: |-
        `StaffAuthService.verifyPin`. Returns the team member and the permissions the till
        should apply (the role matrix in the snapshot's `roles`). **204 No Content = PIN not
        recognised** (the adapter returns `null`). Wrong PINs count towards a limit of 20 checks
        per minute per till account (`429`).

        PINs are set in the BOS workspace (People → Users → Till PIN), 4 digits, unique across
        the chain. Only people who work at one of this account's cafés (or chain-wide accounts)
        are found.
      summary: Check a staff PIN
      parameters:
      - in: header
        name: X-Terminal-Id
        schema:
          type: string
        description: This till, e.g. PHILLIP-TILL-1.
      tags:
      - POS · Device & staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosPinInRequest'
            examples:
              PIN:
                value:
                  pin: '4821'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosPinOut'
              examples:
                Recognised:
                  value:
                    staff:
                      id: 0b6f3c1e-2d7a-4f55-9a61-7c1f0f4d2e11
                      name: Mia Tran
                      initials: MT
                      role: cashier
                      cafe: braddon
                      shift: ''
                    permissions:
                    - pos
                    - orders
                    - reservations.view
                    - customers.view
                    - loyalty.stamp
                    - gift.redeem
                    - kitchen
          description: ''
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '400':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: 'App error: {error: {code, message, fields}}'
