  /api/v1/app/gift-cards/send:
    post:
      operationId: v1_app_gift_cards_send_create
      description: |-
        Buys an eGift card for someone, paid with an Apple Pay token. Send an `Idempotency-Key`
        header (`gift_…`). The sender's balance does not change.

        Answers **`501 NOT_IMPLEMENTED` until a payment provider is connected**.

        **Errors** — `422` "Add their name and a valid email." (`fields.recipientName` /
        `recipientEmail`) · `422` `fields.amountCents` "Choose $25, $50, $75 or $100." · `402
        PAYMENT_DECLINED` without a token · `409` key reused with a different body.
      summary: Buy an eGift card for someone (send an Idempotency-Key header)
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
      tags:
      - App · Loyalty & gift cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftSendInRequest'
            examples:
              EGift:
                value:
                  amountCents: 5000
                  recipientName: Alex
                  recipientEmail: alex@example.com
                  message: Happy birthday!
                  paymentToken: <Apple Pay token>
                summary: eGift
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftActivityOut'
              examples:
                Sent:
                  value:
                    id: 5d2e8f10-9a7b-4c6d-8e5f-4a3b2c1d0e9f
                    kind: sent
                    description: Sent to Alex
                    amountCents: 5000
                    occurredAt: '2026-10-12T08:30:00+11:00'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                NoPaymentProviderYet:
                  value:
                    error:
                      code: NOT_IMPLEMENTED
                      message: Card and Apple Pay payments aren’t available in the
                        app yet. Please order at the café.
                      fields: {}
                  summary: No payment provider yet
          description: ''
        '400':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: 'App error: {error: {code, message, fields}}'
