  /api/v1/app/catering-enquiries:
    post:
      operationId: v1_app_catering_enquiries_create
      description: |-
        Sends a catering enquiry. It lands in BOS → Enquiries and the customer gets an email.
        `dietary` uses display values (`Gluten free`, `Dairy free`, `Vegan`, `Vegetarian`);
        `location` is free text (where the event is).

        **Errors** — unknown package → `fields.packageId` "Choose a catering menu."; then every
        failing field (`firstName`, `lastName`, `email`, `phone` 8+ digits, `notes`, `date` after
        today, `guests` 1–10000, `time` HH:MM) → "Please check the highlighted fields."
      summary: Send a catering enquiry
      tags:
      - App · Bookings & catering
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CateringEnquiryInRequest'
            examples:
              CateringEnquiry:
                value:
                  packageId: lunch
                  firstName: Sophie
                  lastName: Nguyen
                  email: sophie@example.com
                  phone: 0400 123 456
                  company: ''
                  occasion: Team lunch
                  date: '2026-11-02'
                  time: '12:00'
                  guests: 30
                  location: Level 3, 10 Moore St, Canberra
                  dietary:
                  - Vegan
                  - Gluten free
                  notes: Two coeliac guests.
                summary: Catering enquiry
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CateringEnquiryOut'
              examples:
                EnquirySent:
                  value:
                    id: a6f7c2d1-4b3e-4c55-9f0a-2e8d7b6c5a44
                    packageId: lunch
                    packageName: Lunch
                    guests: 30
                    date: '2026-11-02'
                    occasion: Team lunch
                    status: enquiry_sent
                    createdAt: '2026-10-12T08:25:00+11:00'
                  summary: Enquiry sent
          description: ''
