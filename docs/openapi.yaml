  /api/v1/app/auth/sign-up:
    post:
      operationId: v1_app_auth_sign_up_create
      description: |-
        Creates a customer and signs them in (`201` + session).

        Also creates their coffee card (0 stamps, member number `8020 NNNN NNNN`), a $0 gift card and
        default preferences (home café Phillip, "Offers & news" off, everything else on).

        **Password rule:** at least **10 characters**, not a common password, not only digits, not
        similar to the name or email. (The app's form allows 6; a weaker password gets a 422 with a
        clear message under the password field.)

        **Errors** (first failing field) — `name` "Add your full name." · `phone` (8+ digits)
        "Add a mobile number." · `email` "Enter a valid email address." · `password`
        (`too_short`/`invalid`) · `409 CONFLICT` `fields.email: "taken"` "An account with this email
        already exists. Log in instead."
      summary: Create a customer account
      tags:
      - App · Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpInRequest'
            examples:
              NewCustomer:
                value:
                  name: Sophie Nguyen
                  phone: 0400 123 456
                  email: sophie@example.com
                  password: my-long-password
                summary: New customer
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
              examples:
                Session:
                  value:
                    customerId: 6f0c2c3e-5f8b-4a3e-9d55-1d2b7f0a9e10
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIn0.signature
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCJ9.signature
                    expiresAt: '2026-10-12T08:27:40+11:00'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                EmailTaken:
                  value:
                    error:
                      code: CONFLICT
                      message: An account with this email already exists. Log in instead.
                      fields:
                        email: taken
                  summary: Email taken
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                InvalidEmail:
                  value:
                    error:
                      code: VALIDATION
                      message: Enter a valid email address.
                      fields:
                        email: invalid
                  summary: Invalid email
          description: ''
        '400':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: 'App error: {error: {code, message, fields}}'
          content:
