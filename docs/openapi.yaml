      parameters:
      - in: header
        name: X-Terminal-Id
        schema:
          type: string
        description: This till, e.g. PHILLIP-TILL-1.
      - in: query
        name: cafe
        schema:
          type: string
        required: true
      - in: query
        name: since
        schema:
          type: string
        description: '`cursor` from the previous response'
      tags:
      - POS · Orders & kitchen
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosOrderFeedOut'
          description: ''
        '401':
