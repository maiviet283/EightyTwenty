components:
  schemas:
    ActionEnum:
      enum:
      - stamp
      - redeem
      type: string
      description: |-
        * `stamp` - stamp
        * `redeem` - redeem
    AddCardInRequest:
      type: object
      properties:
        sourceToken:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - sourceToken
    AddressInRequest:
      type: object
      properties:
        label:
          $ref: '#/components/schemas/LabelEnum'
        line:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - label
      - line
    AddressOut:
      type: object
      properties:
        id:
          type: string
        label:
          $ref: '#/components/schemas/LabelEnum'
        line:
          type: string
      required:
      - id
      - label
      - line
    AppDietaryLabelEnum:
      enum:
      - Gluten free
      - Dairy free
      - Vegan
      - Vegetarian
      type: string
      description: |-
        * `Gluten free` - Gluten free
        * `Dairy free` - Dairy free
        * `Vegan` - Vegan
        * `Vegetarian` - Vegetarian
    AppDietaryPreferenceEnum:
      enum:
      - gluten_free
      - dairy_free
      - vegan
      - vegetarian
      type: string
      description: |-
        * `gluten_free` - gluten_free
        * `dairy_free` - dairy_free
        * `vegan` - vegan
        * `vegetarian` - vegetarian
    AppLoyaltyActivityTypeEnum:
      enum:
      - earn
      - redeem
      type: string
      description: |-
        * `earn` - earn
        * `redeem` - redeem
    AppSeatingEnum:
      enum:
      - indoor
      - outdoor
      type: string
      description: |-
        * `indoor` - indoor
        * `outdoor` - outdoor
    AppTimingTypeEnum:
      enum:
      - asap
      - scheduled
      type: string
      description: |-
        * `asap` - asap
        * `scheduled` - scheduled
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
