        '503':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/v1/app/auth/sign-in:
    post:
      operationId: v1_app_auth_sign_in_create
      description: |-
        Returns a session for an existing customer. The email is trimmed and case-insensitive.

        After signing in, the app calls `GET /me`. Store `accessToken` and `refreshToken` in the
        device keychain.

        **Errors** — `422 VALIDATION` `fields.email: "invalid"` "Enter a valid email address." ·
        `422` `fields.password: "too_short"` "Your password needs at least 6 characters." ·
        `401 UNAUTHORIZED` "That email and password don’t match. Try again or reset your password."
        · `429` after 10 attempts a minute (per IP and per email).
      summary: Sign in with email and password
      tags:
      - App · Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInInRequest'
            examples:
              SignIn:
                value:
                  email: sophie@example.com
                  password: my-long-password
                summary: Sign in
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
              examples:
                Session:
                  value:
                    customerId: 6f0c2c3e-5f8b-4a3e-9d55-1d2b7f0a9e10
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIn0.signature
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCJ9.signature
                    expiresAt: '2026-10-12T08:27:40+11:00'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                WrongPassword:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: That email and password don’t match. Try again or reset
                        your password.
                      fields: {}
                  summary: Wrong password
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '400':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
