{% load static bos_admin %}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Signed out · EightyTwenty BOS</title>
{% include "admin/includes/bos_head.html" %}
<link rel="stylesheet" href="{% static 'bos/css/admin.css' %}">
<link rel="stylesheet" href="{% static 'bos/css/experience.css' %}">
<link rel="stylesheet" href="{% static 'bos/css/v2.css' %}">
<script src="{% static 'bos/js/admin.js' %}" defer></script>
</head>
<body class="bos-admin bos-login bos-login-single">
  <main class="bos-login-panel" id="content-start">
    <div class="bos-login-top">
      <img class="bos-login-mobile-logo bos-show-light" src="{% static 'bos/img/logo-stacked-brown.webp' %}" alt="EightyTwenty">
      <img class="bos-login-mobile-logo bos-show-dark" src="{% static 'bos/img/logo-stacked-white.webp' %}" alt="EightyTwenty">
      <button type="button" class="bos-icon-btn bos-theme-toggle" data-bos-theme-toggle
              aria-label="Switch between light and dark theme" title="Light / dark theme">
        {% icon 'moon' 'bos-show-light' %}{% icon 'sun' 'bos-show-dark' %}
      </button>
    </div>
    <div class="bos-login-card bos-login-done">
      <span class="bos-login-done-mark">{% icon 'check' %}</span>
      <h1>You're signed out</h1>
      <p class="bos-login-lead">Your session on this device has ended. On a shared computer, close the browser too.</p>
      <a class="bos-btn bos-btn-primary bos-btn-block" href="{% url 'admin:index' %}">Sign in again</a>
    </div>
    <p class="bos-login-foot">© {% now "Y" %} EightyTwenty · Canberra, Australia</p>
  </main>
</body>
</html>
